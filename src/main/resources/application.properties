spring.application.name=ppai-bolsines-cu36
# La API mock del GPS Tracker usa el 8080, por eso esta app corre en el 8081
server.port=8081

# ---------------------------------------------------------------------------
# Base de datos: H2 embebida, guardada en el archivo ./data/bolsines.mv.db
# Consola web: http://localhost:8081/h2-console  (JDBC URL de abajo, usuario sa, sin clave)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/bolsines
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# GPS Tracker: UN modelo para todo el sistema.
# Valores posibles: XTR-4500L | NavTrack QX-7A | GeoPulse MTR-900
# Para la defensa: cambiar esta linea y reiniciar (o arrancar con --gps.tracker.modelo=...)
# ---------------------------------------------------------------------------
gps.tracker.modelo=XTR-4500L
gps.tracker.url-base=http://localhost:8080
gps.tracker.api-key-xtr4500l=sk_xtr_9F3a7C21bE6d4A10f2c8e5b7d913
gps.tracker.api-key-navtrack-qx7a=sk_nav_7b61d9e4c3a2485fae10c77d5b2f
gps.tracker.api-key-geopulse-mtr900=sk_geo_f2d84a1c9e7345b8a6d1c3f0972e

logging.level.ar.edu.utn.frc.dsi.bolsines=INFO
